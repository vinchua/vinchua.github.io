baseURL = "https://vinchua.github.io/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Vincent Chua"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

buildDrafts = false
buildFuture = false
buildExpired = false

# Old Eleventy sources were moved to legacy-eleventy/ on this branch.
# See HUGO.md for details.

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Vincent Chua — DevOps developer, UBC computer engineering grad, Linux tinkerer."
  author = "Vincent Chua"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableScrollToTop = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi, I'm Vincent 👋"
    Content = """
DevOps developer at IBM Canada on the SaaS team for Cloud Pak for Business Automation.
UBC Computer Engineering grad. Linux distro-hopper, pianist, and Mandarin learner.

This site is built with [Hugo](https://gohugo.io/) and the [PaperMod](https://github.com/adityatelange/hugo-PaperMod) theme.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vinchua"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:vchua8@gmail.com"

  [params.editPost]
    URL = "https://github.com/vinchua/vinchua.github.io/edit/master/content/"
    Text = "Edit this page"
    appendFilePath = true

  [params.footer]
    text = "© 2026 Vincent Chua · Built with [Hugo](https://gohugo.io/) and [PaperMod](https://github.com/adityatelange/hugo-PaperMod)"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
